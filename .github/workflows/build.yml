name: Build

on:
  push:
    branches: ['**']
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Version à publier (ex. 2.0.0) : crée le tag vX.Y.Z et la release. Vide = simple build.'
        required: false
        default: ''

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # create the GitHub release on tags

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Version
        id: version
        shell: pwsh
        env:
          RELEASE_INPUT: ${{ inputs.release }}
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME.TrimStart('v')
          } elseif ($env:RELEASE_INPUT) {
            $version = $env:RELEASE_INPUT.Trim().TrimStart('v')
            if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Version invalide : $version" }
          } else {
            $base = ([xml](Get-Content LibrespotTrayApp/LibrespotTrayApp.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
            $version = "$base-dev.$env:GITHUB_RUN_NUMBER"
          }
          $numeric = ($version -split '-')[0]
          "version=$version" >> $env:GITHUB_OUTPUT
          "numeric=$numeric" >> $env:GITHUB_OUTPUT
          Write-Host "Version $version ($numeric)"

      # librespot takes several minutes to compile: reuse it while its build inputs are unchanged.
      - name: Cache librespot
        id: librespot-cache
        uses: actions/cache@v6
        with:
          path: librespot/bin/librespot.exe
          key: librespot-${{ runner.os }}-${{ hashFiles('librespot/build.ps1', 'librespot/patches/**') }}

      - name: Build librespot
        if: steps.librespot-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./librespot/build.ps1

      - name: Check librespot
        shell: pwsh
        run: |
          ./librespot/bin/librespot.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Publish LibrespotTrayApp
        run: dotnet publish LibrespotTrayApp/LibrespotTrayApp.csproj -c Release -o publish_output -p:Version=${{ steps.version.outputs.version }}

      # Stopping librespot gracefully goes through a Ctrl+C sent by a helper instance of the app:
      # check that it works and that the process that asked for it survives.
      - name: Test graceful stop of librespot
        shell: pwsh
        run: |
          function Start-Hidden([string]$exe, [string[]]$arguments, [switch]$KeepStderr) {
            # Same way as the tray app: hidden console, redirected output.
            $psi = [System.Diagnostics.ProcessStartInfo]::new($exe)
            foreach ($a in $arguments) { $psi.ArgumentList.Add($a) }
            $psi.UseShellExecute = $false
            $psi.CreateNoWindow = $true
            $psi.RedirectStandardOutput = $true
            $psi.RedirectStandardError = $true
            $p = [System.Diagnostics.Process]::Start($psi)
            $p.BeginOutputReadLine()
            if (-not $KeepStderr) { $p.BeginErrorReadLine() }
            return $p
          }
          function Stop-WithHelper([System.Diagnostics.Process]$target) {
            $helper = Start-Process publish_output\LibrespotTrayApp.exe -ArgumentList '--send-ctrl-c', $target.Id -PassThru -Wait
            Write-Host "Helper exit code: $($helper.ExitCode)"
            if (-not $target.WaitForExit(5000)) {
              $target.Kill()
              throw "The process did not stop after Ctrl+C"
            }
          }

          $ping = Start-Hidden 'ping.exe' @('-t', '127.0.0.1')
          Start-Sleep -Seconds 2
          Stop-WithHelper $ping
          Write-Host "ping stopped by Ctrl+C"

          $session = New-Item -ItemType Directory -Force (Join-Path $env:RUNNER_TEMP 'librespot-session')
          $librespot = Start-Hidden 'publish_output\librespot.exe' @('--name', 'CI', '--system-cache', $session.FullName, '--disable-discovery', '--enable-oauth', '--oauth-port', '8067') -KeepStderr
          Start-Sleep -Seconds 3
          if ($librespot.HasExited) { throw "librespot exited early (code $($librespot.ExitCode)):`n$($librespot.StandardError.ReadToEnd())" }
          Stop-WithHelper $librespot
          $log = $librespot.StandardError.ReadToEnd()
          Write-Host $log
          Write-Host "librespot stopped by Ctrl+C (exit code $($librespot.ExitCode)); this step is still running, so the caller survived"

      # With a bogus token librespot creates its player (and the media controls), then exits when
      # Spotify rejects the login.
      - name: Test Windows media controls
        shell: pwsh
        run: |
          $psi = [System.Diagnostics.ProcessStartInfo]::new('publish_output\librespot.exe')
          foreach ($a in @('--name', 'CI', '--disable-discovery', '--access-token', 'invalid', '--media-controls')) { $psi.ArgumentList.Add($a) }
          $psi.UseShellExecute = $false
          $psi.CreateNoWindow = $true
          $psi.RedirectStandardError = $true
          $p = [System.Diagnostics.Process]::Start($psi)
          $log = $p.StandardError.ReadToEndAsync()
          if (-not $p.WaitForExit(30000)) { $p.Kill(); throw "librespot did not exit" }
          Write-Host $log.Result
          if ($log.Result -notmatch 'Windows media controls enabled') { throw "Media controls were not enabled" }

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          & $iscc "/DPublishDir=$PWD\publish_output" "/DAppVersion=${{ steps.version.outputs.version }}" "/DAppNumericVersion=${{ steps.version.outputs.numeric }}" "/O$PWD\dist" Installer\LibrespotTrayApp.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: LibrespotTrayApp-${{ steps.version.outputs.version }}
          path: dist/*.exe

      - name: Create release
        if: github.ref_type == 'tag' || inputs.release
        uses: softprops/action-gh-release@v2
        with:
          # Created on the built commit when it does not exist yet (manual release).
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: LibrespotTrayApp v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: dist/*.exe
